<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Students | PlacementLink</title>
    <link rel="stylesheet" href="css/portal.css?v=1">
    <script>try{var t=localStorage.getItem('portal-theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}else if(!t&&matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}</script>
</head>
<body data-role="coordinator" data-active="students" data-title="My Students">

<aside class="sidebar" id="sidebar"></aside>

<div class="app-main">
    <header class="app-header" id="appHeader"></header>

    <main class="page-content">
        <div class="page-heading">
            <h1>My Students</h1>
            <p>Students assigned to you by the admin.</p>
        </div>

        <div class="toolbar">
            <div class="search-wrap search-prominent">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
                <input type="search" id="searchBox" class="search" placeholder="Search name, email, enrollment number..." aria-label="Search students" autocomplete="off">
                <button type="button" id="searchClearBtn" class="search-clear hidden" aria-label="Clear search">✕</button>
            </div>
        </div>

        <div class="filter-panel open" id="filterPanel">
            <div class="filter-section">
                <h3>Filters</h3>
                <p class="section-help">Filter assigned students by academic attributes.</p>
                <div class="filter-grid">
                    <div class="form-group">
                        <label for="branchFilter">Branch</label>
                        <select id="branchFilter"><option value="">All Branches</option></select>
                    </div>
                    <div class="form-group">
                        <label for="sectionFilter">Section</label>
                        <select id="sectionFilter"><option value="">All Sections</option></select>
                    </div>
                    <div class="form-group">
                        <label for="batchFilter">Batch</label>
                        <select id="batchFilter"><option value="">All Batches</option></select>
                    </div>
                    <div class="form-group">
                        <label for="studentStatusFilter">Student Status</label>
                        <select id="studentStatusFilter"><option value="">All Statuses</option></select>
                    </div>
                    <div class="form-group">
                        <label for="applicationStatusFilter">Job Status</label>
                        <select id="applicationStatusFilter"><option value="">All Statuses</option></select>
                    </div>
                    <div class="form-group">
                        <label for="companyFilter">Company</label>
                        <select id="companyFilter"><option value="">All Companies</option></select>
                    </div>
                    <div class="form-group">
                        <label for="jobFilter">Job</label>
                        <select id="jobFilter"><option value="">All Jobs</option></select>
                    </div>
                    <div class="form-group">
                        <label for="roundFilter">Round</label>
                        <select id="roundFilter"><option value="">All Rounds</option></select>
                    </div>
                </div>
            </div>
            <div class="filter-actions">
                <button type="button" class="btn btn-secondary" id="resetFiltersBtn">Reset</button>
            </div>
        </div>

        <div class="list-meta">
            <span id="resultCount">Loading students...</span>
        </div>

        <div class="table-responsive">
            <table class="student-table">
                <thead>
                <tr>
                    <th>Student</th>
                    <th>Email</th>
                    <th>Branch</th>
                    <th>Section</th>
                    <th>Batch</th>
                    <th>Applications</th>
                    <th>Placement Status</th>
                    <th class="th-actions">Action</th>
                </tr>
                </thead>
                <tbody id="studentsBody">
                <tr><td colspan="8" style="text-align:center;padding:24px;color:var(--text-muted)">Loading students...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="pagination" id="pagination"></div>

        <div class="empty" id="emptyMsg" style="display:none;">
            <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4.2l1.8 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 10h18"/></svg></div>
            <div class="empty-title" id="emptyTitle">No students found.</div>
            <p id="emptySub">Try adjusting your search or filters.</p>
        </div>
    </main>
</div>

<script src="js/ui.js?v=1"></script>
<script src="js/coordinator-students.js?v=1"></script>
</body>
</html>
