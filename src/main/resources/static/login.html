<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | LLOYD Career</title>
    <link rel="stylesheet" href="css/portal.css?v=20">
    <script>try{var t=localStorage.getItem('portal-theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}else if(!t&&matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}</script>
</head>
<body class="landing-page">

<nav class="lp-nav">
    <a href="index.html" class="lp-brand">
        <img src="https://liet.in/wp-content/uploads/2025/12/LIET-new-logo.webp" alt="LIET Logo" style="height:40px;">
        <span class="lp-nameblock">
            <span class="lp-name">LLOYD Career</span>
            <span class="lp-sub">Training &amp; Placement Cell</span>
        </span>
    </a>
    <div class="lp-actions">
        <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme"></button>
        <a href="index.html" class="lp-signin">Back to Home</a>
    </div>
</nav>

<section class="lp-hero-wrapper gate-open">
    <div class="lp-hero-content">
        <div class="auth-hero-card">
            <h2 id="authHeading">Student Sign In</h2>
            <p class="auth-subtitle" id="authSubtitle">Sign in with your registered email and password.</p>

            <form id="loginForm" class="auth-form">
                <div class="input-group" id="studentEmailGroup">
                    <label for="studentEmail">Email ID</label>
                    <input type="email" id="studentEmail" placeholder="you@liet.in" autocomplete="username" required>
                </div>
                <div class="input-group" id="studentPasswordGroup">
                    <label for="studentPassword">Password</label>
                    <input type="password" id="studentPassword" placeholder="Enter your password" autocomplete="current-password" minlength="8" maxlength="72" required>
                </div>
                <div class="input-group" id="staffEmailGroup" style="display:none;">
                    <label for="staffEmail">Staff Email ID</label>
                    <input type="email" id="staffEmail" placeholder="you@liet.in" autocomplete="username">
                </div>
                <div class="input-group" id="staffPasswordGroup" style="display:none;">
                    <label for="staffPassword">Password</label>
                    <input type="password" id="staffPassword" placeholder="Enter your password" autocomplete="current-password" minlength="8" maxlength="72">
                </div>
                <div class="input-group" id="regNameGroup" style="display:none;">
                    <label for="regName">Full Name</label>
                    <input type="text" id="regName" placeholder="Your full name" maxlength="80">
                </div>
                <div class="input-group" id="regEmailGroup" style="display:none;">
                    <label for="regEmail">College Email</label>
                    <input type="email" id="regEmail" placeholder="you@liet.in">
                </div>
                <div class="input-group" id="regBatchGroup" style="display:none;">
                    <label>Batch (start – end year)</label>
                    <div class="batch-row">
                        <input type="number" id="regBatchStart" min="2000" max="2100" placeholder="Start e.g. 2024" aria-label="Batch start year">
                        <span class="batch-sep" aria-hidden="true">–</span>
                        <input type="number" id="regBatchEnd" min="2000" max="2100" placeholder="End e.g. 2028" aria-label="Batch end year">
                    </div>
                </div>
                <div class="input-group" id="regTenthGroup" style="display:none;">
                    <label for="regTenth">10th Percentage</label>
                    <input type="number" id="regTenth" min="0" max="100" step="0.01" placeholder="e.g. 75">
                </div>
                <div class="input-group" id="regTwelfthGroup" style="display:none;">
                    <label for="regTwelfth">12th Percentage</label>
                    <input type="number" id="regTwelfth" min="0" max="100" step="0.01" placeholder="e.g. 72">
                </div>
                <div class="input-group" id="regEnrollmentGroup" style="display:none;">
                    <label for="regEnrollment">Enrollment Number</label>
                    <input type="text" id="regEnrollment" placeholder="e.g. 2021XXXXXX" maxlength="50">
                </div>
                <div class="input-group" id="regMobileGroup" style="display:none;">
                    <label for="regMobile">Mobile Number</label>
                    <input type="tel" id="regMobile" placeholder="10-digit registered number" autocomplete="tel" maxlength="10" pattern="[0-9]{10}">
                </div>
                <div class="input-group" id="regPasswordGroup" style="display:none;">
                    <label for="regPassword">Create Password</label>
                    <input type="password" id="regPassword" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" maxlength="72">
                </div>
                <div class="input-group" id="regPasswordConfirmGroup" style="display:none;">
                    <label for="regPasswordConfirm">Confirm Password</label>
                    <input type="password" id="regPasswordConfirm" placeholder="Re-enter your password" autocomplete="new-password" minlength="8" maxlength="72">
                </div>
                <p id="message" style="display:none; margin-top: 4px; font-size: 13px;"></p>
                <button type="submit" id="loginButton" class="btn auth-submit">SIGN IN</button>
            </form>

            <div id="otpSection" style="display:none;">
                <p class="message success" id="otpSentMessage"></p>
                <form id="otpForm" class="auth-form">
                    <div class="input-group">
                        <label for="otp">Six-digit OTP</label>
                        <input type="text" id="otp" inputmode="numeric" maxlength="6" placeholder="&middot;&middot;&middot;&middot;&middot;&middot;" autocomplete="one-time-code" required>
                    </div>
                    <button type="submit" id="otpButton" class="btn auth-submit">VERIFY OTP</button>
                </form>
                <div class="auth-links">
                    <a href="#" id="backToLogin">&larr; Back</a>
                    <span><a href="#" id="resendOtp">Resend OTP</a> <span id="resendCountdown" aria-live="polite"></span></span>
                </div>
            </div>

            <div id="resetSection" style="display:none;">
                <p class="message success" id="resetSentMessage"></p>
                <form id="resetForm" class="auth-form">
                    <div class="input-group">
                        <label for="resetEmail">Email ID</label>
                        <input type="email" id="resetEmail" autocomplete="email" readonly required>
                    </div>
                    <div class="input-group" id="resetOtpGroup">
                        <label for="resetOtp">Six-digit OTP</label>
                        <input type="text" id="resetOtp" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="Enter email code" autocomplete="one-time-code" required>
                    </div>
                    <div class="input-group" id="newPasswordGroup" style="display:none;">
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" autocomplete="new-password" minlength="8" maxlength="72">
                    </div>
                    <div class="input-group" id="confirmNewPasswordGroup" style="display:none;">
                        <label for="confirmNewPassword">Confirm New Password</label>
                        <input type="password" id="confirmNewPassword" autocomplete="new-password" minlength="8" maxlength="72">
                    </div>
                    <p id="resetMessage" style="display:none; margin-top:4px; font-size:13px;"></p>
                    <button type="submit" id="resetButton" class="btn auth-submit">VERIFY OTP</button>
                </form>
                <div class="auth-links">
                    <a href="#" id="backToLoginFromReset">&larr; Back to sign in</a>
                    <span><a href="#" id="resendResetOtp">Resend OTP</a> <span id="resetCountdown" aria-live="polite"></span></span>
                </div>
            </div>

            <p class="auth-toggle" id="authToggleWrap" style="margin-top: 14px; text-align: center; font-size: 13px;">
                <a href="#" id="toggleAuthMode">New student? Register here</a>
            </p>
            <div class="auth-links" id="authModeLinks">
                <a href="#" id="forgotPasswordLink">Forgot password?</a>
                <a href="#" id="staffLoginLink">Staff sign in</a>
            </div>

            <div class="auth-footer">Can't sign in? Write to the placement cell at <a href="mailto:Lloydedu@liet.in">Lloydedu@liet.in</a></div>
        </div>
    </div>
</section>

<script src="js/ui.js?v=10"></script>
<script src="js/login-auth.js?v=5"></script>
</body>
</html>
