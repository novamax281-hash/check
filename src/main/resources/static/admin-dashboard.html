<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | PlacementLink</title>
    <link rel="stylesheet" href="css/portal.css?v=1">
    <script>try{var t=localStorage.getItem('portal-theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}else if(!t&&matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}</script>
</head>
<body data-role="admin" data-active="dashboard" data-title="Admin Dashboard">

<aside class="sidebar" id="sidebar"></aside>

<div class="app-main">
    <header class="app-header" id="appHeader"></header>

    <main class="page-content">
        <div class="page-heading">
            <h1>Admin Dashboard</h1>
            <p>Overview of placements and applications.</p>
        </div>

        <div class="stat-grid">
            <div class="stat-card">
                <strong id="statPlacements">0</strong>
                <span>Total Placements</span>
            </div>
            <div class="stat-card">
                <strong id="statApplications">0</strong>
                <span>Total Applications</span>
            </div>
            <div class="stat-card">
                <strong id="statUnderReview">0</strong>
                <span>Under Review</span>
            </div>
            <div class="stat-card">
                <strong id="statShortlisted">0</strong>
                <span>Shortlisted</span>
            </div>
            <div class="stat-card">
                <strong id="statSelected">0</strong>
                <span>Selected</span>
            </div>
            <div class="stat-card">
                <strong id="statRejected">0</strong>
                <span>Rejected</span>
            </div>
        </div>

        <div class="toolbar">
            <a class="btn" href="admin-placements.html">Manage Placements</a>
            <a class="btn btn-secondary" href="admin-applications.html">View Applications</a>
        </div>
    </main>
</div>

<script src="js/ui.js?v=1"></script>
<script src="js/admin-dashboard.js?v=1"></script>
</body>
</html>
