<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Placements | LLOYD Career</title>
    <link rel="stylesheet" href="css/portal.css?v=25">
    <script>try{var t=localStorage.getItem('portal-theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}else if(!t&&matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}</script>
</head>
<body data-role="student" data-active="placements" data-title="Apply for Placements">

<aside class="sidebar" id="sidebar"></aside>

<div class="app-main">
    <header class="app-header" id="appHeader"></header>

    <main class="page-content">
        <div class="page-heading">
            <h1>Available Opportunities</h1>
            <p>Explore current campus drives and submit your application.</p>
        </div>

        <div class="step-card" style="padding: 20px;">
            <div class="toolbar">
                <input type="search" id="searchBox" class="search" placeholder="Search company or job role...">
                <select id="companyFilter"><option value="">All companies</option></select>
                <select id="locationFilter"><option value="">All locations</option></select>
                <select id="statusFilter"><option value="">All statuses</option></select>
            </div>
        </div>

        <div class="cards-grid" id="cardsGrid"></div>

        <div class="show-more-wrap" id="showMoreWrap" style="display:none;">
            <button type="button" class="btn btn-outline show-more-btn" id="showMoreBtn"></button>
            <p class="show-more-count" id="showMoreCount"></p>
        </div>
        
        <div class="empty" id="emptyMsg" style="display:none;">
            <div class="empty-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 7a2 2 0 0 1 2-2h4.2l1.8 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <path d="M3 10h18"/>
                </svg>
            </div>
            <div class="empty-title">No placements found</div>
            <p>Try adjusting your filters or search terms.</p>
        </div>
    </main>
</div>

<div class="modal" id="resumeModal" role="dialog" aria-modal="true" aria-labelledby="resumeModalTitle">
    <div class="modal-box">
        <div class="modal-header">
            <h2 id="resumeModalTitle">Add your resume</h2>
        </div>
        <p style="color:var(--text-muted);">Share a public link to the resume you want this company to review.</p>
        <div class="form-group">
            <label for="resumeUrlInput">Resume URL</label>
            <input type="url" id="resumeUrlInput" placeholder="https://example.com/my-resume.pdf" required autocomplete="url">
        </div>
        <div class="form-group" id="roleSelectionGroup" hidden>
            <label for="selectedRoleInput">Job role you are applying for</label>
            <select id="selectedRoleInput" required></select>
        </div>
        <div class="form-group" id="courseSelectionGroup" hidden>
            <label for="selectedCourseInput">Course</label>
            <select id="selectedCourseInput" required></select>
        </div>
        <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="cancelResumeBtn">Cancel</button>
            <button type="button" class="btn" id="submitApplicationBtn">Submit application</button>
        </div>
    </div>
</div>

<div class="modal" id="jobDetailsModal" role="dialog" aria-modal="true" aria-labelledby="jobDetailsTitle">
    <div class="modal-box modal-lg">
        <div class="modal-header">
            <h2 id="jobDetailsTitle">Opportunity details</h2>
            <button class="modal-close" id="jobDetailsClose" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body" id="jobDetailsBody"></div>
        <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="jobDetailsCancel">Close</button>
        </div>
    </div>
</div>

<script src="js/ui.js?v=11"></script>
<script src="js/placement-apply.js?v=13"></script>
</body>
</html>
