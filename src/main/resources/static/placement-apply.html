<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Placements | PlacementLink</title>
    <link rel="stylesheet" href="css/portal.css?v=1">
    <script>try{var t=localStorage.getItem('portal-theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}else if(!t&&matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}</script>
</head>
<body data-role="student" data-active="placements" data-title="Apply for Placements">

<aside class="sidebar" id="sidebar"></aside>

<div class="app-main">
    <header class="app-header" id="appHeader"></header>

    <main class="page-content">
        <div class="page-heading">
            <h1>Available Placements</h1>
            <p>Browse current openings and apply in one click.</p>
        </div>

        <div class="toolbar">
            <input type="search" id="searchBox" class="search" placeholder="Search company or job role...">
            <select id="batchFilter"><option value="">All batches</option></select>
            <select id="branchFilter"><option value="">All branches</option></select>
            <select id="companyFilter"><option value="">All companies</option></select>
            <select id="roleFilter"><option value="">All roles</option></select>
            <select id="skillFilter"><option value="">All skills</option></select>
            <select id="eligibilityFilter"><option value="">All eligibility</option></select>
            <select id="locationFilter"><option value="">All locations</option></select>
            <select id="periodFilter"><option value="">All periods</option></select>
            <select id="statusFilter"><option value="">All statuses</option></select>
            <input type="date" id="dateFrom" title="Deadline from" aria-label="Deadline from">
            <input type="date" id="dateTo" title="Deadline to" aria-label="Deadline to">
            <label class="upcoming-toggle" title="Show only placements whose deadline hasn't passed">
                <input type="checkbox" id="upcomingFilter">
                <span>Upcoming only</span>
            </label>
        </div>

        <div class="cards-grid" id="cardsGrid"></div>
        <div class="empty" id="emptyMsg" style="display:none;">
            <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4.2l1.8 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 10h18"/></svg></div>
            <div class="empty-title">No placements found</div>
            <p>Try adjusting your filters or search terms.</p>
        </div>
    </main>
</div>

<script src="js/ui.js?v=1"></script>
<script src="js/placement-apply.js?v=1"></script>
</body>
</html>
