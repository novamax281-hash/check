<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications | LLOYD Career</title>
    <link rel="stylesheet" href="css/portal.css?v=25">
    <script>try{var t=localStorage.getItem('portal-theme');if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}else if(!t&&matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}</script>
</head>
<body data-role="student" data-active="applications" data-title="My Applications">

<aside class="sidebar" id="sidebar"></aside>

<div class="app-main">
    <header class="app-header" id="appHeader"></header>

    <main class="page-content">
        <div class="page-heading heading-row">
            <div>
                <h1>My Applications</h1>
                <p>Track your round progress and application status.</p>
            </div>
            <a class="btn" href="placement-apply.html">+ Explore More Drives</a>
        </div>

        <div class="step-card" style="padding: 20px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <span style="font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted);">Filters</span>
                <button type="button" class="btn btn-small btn-secondary" id="clearFiltersBtn">Clear all</button>
            </div>
            <div class="toolbar">
                <input type="search" id="searchBox" class="search" placeholder="Search company, role, batch, branch, location...">
                <select id="companyFilter"><option value="">All companies</option></select>
                <select id="statusFilter"><option value="">All statuses</option></select>
            </div>
        </div>

        <div class="list-meta" id="listMeta"><span id="resultCount"></span></div>

        <div class="table-responsive">
            <table>
                <thead>
                <tr>
                    <th>Company / Role</th>
                    <th>Batch &middot; Branch</th>
                    <th>Status</th>
                    <th>Applied</th>
                    <th>Progress</th>
                    <th style="text-align:right;">Details</th>
                </tr>
                </thead>
                <tbody id="appsBody"></tbody>
            </table>
        </div>
        
        <div class="pagination" id="pagination"></div>

        <div class="empty" id="emptyMsg" style="display:none;">
            <div class="empty-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 7a2 2 0 0 1 2-2h4.2l1.8 2H19a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <path d="M3 10h18"/>
                </svg>
            </div>
            <div class="empty-title">No applications found</div>
            <p>Try adjusting your search or filters, or explore and apply to new placement drives.</p>
            <a class="btn btn-secondary" href="placement-apply.html" style="margin-top:14px;">Browse Placement Drives</a>
        </div>
    </main>
</div>

<script src="js/ui.js?v=11"></script>
<script src="js/my-applications.js?v=6"></script>
</body>
</html>
