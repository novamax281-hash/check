
spring.application.name=WebApp

server.port=${PORT:8081}
server.forward-headers-strategy=framework

spring.config.import=optional:file:.env[.properties]

server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1KB

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE}
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.connect-timeout=10s
spring.data.mongodb.socket-timeout=20s

spring.jackson.deserialization.fail-on-unknown-properties=false

logging.level.org.springframework=INFO
logging.level.org.mongodb.driver=WARN
logging.level.org.springframework.data.mongodb.core.MongoTemplate=WARN

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

server.servlet.session.cookie.same-site=${SESSION_SAME_SITE:none}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_SECURE:true}
server.servlet.session.cookie.path=/

CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}

google.recaptcha.site-key=${GOOGLE_RECAPTCHA_SITE_KEY}
google.recaptcha.secret-key=${GOOGLE_RECAPTCHA_SECRET_KEY}
