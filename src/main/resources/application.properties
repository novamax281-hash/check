spring.application.name=WebApp
server.port=8081
spring.config.import=optional:file:.env[.properties]

# Gzip text assets so the browser downloads far less (portal.css is ~90KB uncompressed).
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1KB

# Supply a complete Atlas URI through MONGODB_URI. Do not commit credentials here.
spring.data.mongodb.uri=mongodb+srv://placement_1:placement_2@cluster0.9ocuvyt.mongodb.net/?appName=Cluster0
spring.data.mongodb.database=Placements
spring.data.mongodb.auto-index-creation=true

# Bound DNS/server selection and socket waits so outages fail clearly instead of hanging requests.
spring.data.mongodb.connect-timeout=10s
spring.data.mongodb.socket-timeout=20s

spring.jackson.deserialization.fail-on-unknown-properties=false

logging.level.org.springframework=INFO
logging.level.org.mongodb.driver=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO


